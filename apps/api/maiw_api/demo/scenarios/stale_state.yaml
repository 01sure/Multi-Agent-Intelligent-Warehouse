name: stale_state
display_name: "陈旧状态"
description: >
  状态提供者时钟比实际时间滞后 45 分钟。世界中存在设备分配，
  但状态快照滞后。决策引擎应对高风险操作返回 requires_fresh_state，
  直到状态刷新。测试陈旧状态治理路径。
tags: [stale, governance, demo]
rng_seed: 42
clock_offset_seconds: -2700  # 45 min stale (negative offset = old snapshot)

